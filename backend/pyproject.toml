[project]
name = "formline"
version = "0.1.0"
description = "Synthetic Match Insights Engine — ingest, interpret, explain, render, personalize"
requires-python = ">=3.12"
dependencies = [
    "agent-framework>=1.19.0",
    "fastapi>=0.143.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formline"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
